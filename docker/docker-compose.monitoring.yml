services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: smartledger-otel-collector
    restart: on-failure
    volumes:
      - ./config/otel-collector/config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    command: ["--config", "/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - prometheus
      - loki
      - jaeger-all-in-one
    networks:
      - smartledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: smartledger-prometheus
    restart: on-failure
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - smartledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Loki
  loki:
    image: grafana/loki:latest
    container_name: smartledger-loki
    restart: on-failure
    ports:
      - '3100:3100'
    volumes:
    - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    - loki-data:/loki
    networks:
      - smartledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    container_name: smartledger-jaeger
    restart: on-failure
    ports:
      - "16686:16686"   # Web UI
      - "14268:14268"   # HTTP collector
      - "14250:14250"   # GRPC collector
      - "6831:6831/udp" # Jaeger Agent (UDP)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - smartledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: smartledger-grafana
    restart: on-failure
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger-all-in-one
     
    networks:
      - smartledger-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  smartledger-network:
    driver: bridge    